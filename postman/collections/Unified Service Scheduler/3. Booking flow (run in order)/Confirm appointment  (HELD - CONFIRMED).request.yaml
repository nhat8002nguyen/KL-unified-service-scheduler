$kind: http-request
name: Confirm appointment  (HELD -> CONFIRMED)
url: "{{baseUrl}}/appointments/{{appointmentId}}/confirm"
method: POST
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: pm.test('200 CONFIRMED', () => { pm.response.to.have.status(200); pm.expect(pm.response.json().appointment.status).to.eql('CONFIRMED'); });
    language: text/javascript
order: 4000
